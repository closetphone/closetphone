<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/assets/icon/gtaradio.ico" type="image/x-icon">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA 5 Radio Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #141414;
    --node: rgba(255,255,255,0.05);
    --node-border: rgba(255,255,255,0.12);
    --node-text: rgba(255,255,255,0.5);
    --active-glow: #4aa3ff;
    --text: #f2f2f2;
    --panel: rgba(0,0,0,0.5);
    --panel-border: rgba(255,255,255,0.05);
    --easter-glow: #ffaa44;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  .bg-logo{
    position: fixed;
    top: 50%;
    left: 50%;
    width: 120vmax;
    height: 120vmax;
    background-image: url('assets/images/gta/logo-transparent.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    transform: translate(-50%, -50%) rotate(35deg);
    opacity: 0.1;
    z-index: -1;
    pointer-events: none;
  }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .app{
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }

  /* ---------------- WHEEL LAYOUT ---------------- */
  .wheel-wrap{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 620px;
    margin: 0 auto;
  }

  .wheel-inner{
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
  }

  .center-info{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 40%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    user-select: none;
  }
  
  .center-info .station-name{
    font-size: clamp(1.1rem, 3.3vw, 1.7rem);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.2;
    color: var(--text);
    cursor: pointer;
  }
  .center-info .status-msg{
    font-size: clamp(0.7rem, 2vw, 0.85rem);
    font-weight: 300;
    color: var(--active-glow);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
    line-height: 1.2;
    cursor: pointer;
  }
  .center-info .status-msg.loading{
    animation: statusPulse 1.4s ease-in-out infinite;
  }
  @keyframes statusPulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .node{
    position: absolute;
    transform: translate(-50%, -50%);
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--node);
    border: 1px solid var(--node-border);
    color: var(--node-text);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.1;
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px;
    transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none;
  }
  .node img{
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 2px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .wheel-inner.icons-loaded .node img{
    opacity: 1;
  }
  .node.active img{
    padding: 0px;
  }
  .node:hover{
    color: var(--text);
    border-color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.08);
    z-index: 5;
  }
  .node.active{
    color: var(--text);
    background: rgba(74,163,255,0.1);
    border: 2px solid var(--active-glow);
    box-shadow: 0 0 20px rgba(74,163,255,0.4), inset 0 0 8px rgba(74,163,255,0.2);
    font-weight: 600;
    z-index: 6;
  }

  /* ---------------- TRUE-CENTERED EASTER EGG ---------------- */
  .node.easter-node {
    position: absolute; /* Takes it completely out of normal flow when hidden */
    top: 50%; 
    left: 50%;
    transform: translate(-50%, -50%) scale(0.1);
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 12;
  }
  .node.easter-node:hover {
    color: var(--text);
    border-color: rgba(255,170,68,0.5);
    background: rgba(255,170,68,0.08);
  }
  .node.easter-node.reveal {
    opacity: 1;
    pointer-events: auto;
    /* Pushes it below the text block only when revealed */
    top: calc(100% + 46px); 
    transform: translate(-50%, -50%) scale(1);
  }
  .node.easter-node.active {
    color: var(--text);
    background: rgba(255,170,68,0.1);
    border: 2px solid var(--easter-glow);
    box-shadow: 0 0 20px rgba(255,170,68,0.4), inset 0 0 8px rgba(255,170,68,0.2);
  }

  @media (max-width: 640px) {
    .node { width: 58px; height: 58px; font-size: 7.5px; padding: 4px; }
    .node.easter-node.reveal { top: calc(100% + 38px); }
  }

  @media (max-width: 480px) {
    .node { width: 48px; height: 48px; font-size: 6.5px; padding: 2px; }
    .node.easter-node.reveal { top: calc(100% + 32px); }
  }

  /* ---------------- PLAYER ---------------- */
  .player{
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .controls{
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctrl-btn.primary{ 
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: var(--text);
    width: 54px; height: 54px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.15s ease;
  }
  .ctrl-btn.primary:hover{ border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.05); }

  .player-frame-wrap{
    position: relative;
    width: 100%;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
    background: #000;
  }
  .player-frame-wrap iframe{
    display: block;
    width: 100%;
    aspect-ratio: 16/9;
    border: 0;
  }
</style>
</head>
<body>

<div class="bg-logo"></div>

<div class="app">

  <div class="wheel-wrap">
    <div class="wheel-inner" id="wheelNodes">
      <div class="center-info" id="centerTrigger">
        <div class="station-name" id="centerStation">Radio Los Santos</div>
        <div class="status-msg loading" id="centerStatus">Tuning Station...</div>
        <div class="node easter-node" id="mojaveNode">Mojave Radio</div>
      </div>
    </div>
  </div>

  <div class="player">
    <div class="controls">
      <button class="ctrl-btn primary" id="playBtn" title="Play/Pause">&#9658;</button>
    </div>
    <div class="player-frame-wrap">
      <div id="ytPlayer"></div>
    </div>
  </div>

</div>

<script>
  const stationTracks = {
    "Radio Los Santos": "C3_FSXZtRe8",
    "Space 103.2": "6TnV43UWoqk",
    "West Coast Classics": "z0Wf3IuZnf0",
    "Rebel Radio": "HeLsaX1I5B4",
    "Los Santos Rock Radio": "fZPV-9GlM-c",
    "The Lowdown 91.1": "fZPV-9GlM-c",
    "Blue Ark": "LRdjhqMYSGg",
    "Non-Stop-Pop FM": "Fjp0wu3lEHk",
    "East Los FM": "xTpsoTmhdNc",
    "WorldWide FM": "xTpsoTmhdNc",
    "Channel X": "HHG44PJ0oyo",
    "Radio Mirror Park": "SDWHIACuuaQ",
    "Vinewood Boulevard Radio": "5fnGyUc2eFs",
    "Soulwax FM": "EhsQZl8BFz8",
    "FlyLo FM": "3P-ux63rHkU",
    "The Lab": "Xy75nA56vcc",
    "blonded Los Santos 97.8 FM": "-tVumJBaTWY",
    "Los Santos Underground Radio": "I2Xjuz-mnN0",
    "iFruit Radio": "fpvJaphZ2_g",
    "Kult FM 99.1": "9cL6IDCtuzs",
    "Still Slipping Los Santos": "P3qixldzDow",
    "Music Locker Radio": "dBvMBYbUZFc",
    "MOTOMAMI Los Santos": "30uA_Hppzpc",
    "Mojave Radio": "Tn1FPZb3rmw"
  };

  const stations = Object.keys(stationTracks).filter(s => s !== "Mojave Radio");
  const initialStation = stations[Math.floor(Math.random() * stations.length)];

  const stationIcons = {
    "Radio Los Santos": "assets/images/gta/radiolossantos.png",
    "Space 103.2": "assets/images/gta/space.png",
    "West Coast Classics": "assets/images/gta/westcoastclassics.png",
    "Rebel Radio": "assets/images/gta/rebelradio.png",
    "Los Santos Rock Radio": "assets/images/gta/lossantosrockradio.png",
    "The Lowdown 91.1": "assets/images/gta/thelowdown.png",
    "Blue Ark": "assets/images/gta/blueark.png",
    "Non-Stop-Pop FM": "assets/images/gta/nonstoppop.png",
    "East Los FM": "assets/images/gta/eastlosfm.png",
    "WorldWide FM": "assets/images/gta/worldwidefm.png",
    "Channel X": "assets/images/gta/channelx.png",
    "Radio Mirror Park": "assets/images/gta/radiomirrorpark.png",
    "Vinewood Boulevard Radio": "assets/images/gta/vinewoodboulevardradio.png",
    "Soulwax FM": "assets/images/gta/soulwaxfm.png",
    "FlyLo FM": "assets/images/gta/flylofm.png",
    "The Lab": "assets/images/gta/thelab.png",
    "blonded Los Santos 97.8 FM": "assets/images/gta/blonded.png",
    "Los Santos Underground Radio": "assets/images/gta/lossantosundergroundradio.png",
    "iFruit Radio": "assets/images/gta/ifruit.png",
    "Kult FM 99.1": "assets/images/gta/kultfm.png",
    "Still Slipping Los Santos": "assets/images/gta/stillslipping.png",
    "Music Locker Radio": "assets/images/gta/musiclocker.png",
    "MOTOMAMI Los Santos": "assets/images/gta/motomami.png"
  };

  // ---------------------------------------------------------------
  // MATHEMATICAL CIRCLE ENGINE
  // ---------------------------------------------------------------
  const wheelNodesEl = document.getElementById('wheelNodes');
  const n = stations.length;
  const radius = 42; 

  stations.forEach((name, i) => {
    const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
    
    const x = 50 + radius * Math.cos(angle);
    const y = 50 + radius * Math.sin(angle);

    const node = document.createElement('div');
    node.className = 'node' + (name === initialStation ? ' active' : '');
    node.style.left = x + '%';
    node.style.top = y + '%';
    if (stationIcons[name]) {
      const img = document.createElement('img');
      img.src = stationIcons[name];
      img.alt = name;
      node.appendChild(img);
      node.title = name;
    } else {
      node.textContent = name;
    }
    node.dataset.station = name;
    node.addEventListener('click', () => selectStation(name));
    wheelNodesEl.appendChild(node);
  });

  document.getElementById('centerStation').textContent = initialStation;

  // ---------------------------------------------------------------
  // ICON PRELOADING
  // ---------------------------------------------------------------
  const iconUrls = Object.values(stationIcons);
  let loadedCount = 0;
  const totalIcons = iconUrls.length;

  function onIconSettled(){
    loadedCount++;
    if (loadedCount >= totalIcons) {
      wheelNodesEl.classList.add('icons-loaded');
      const statusEl = document.getElementById('centerStatus');
      statusEl.classList.remove('loading');
      statusEl.textContent = isPlaying ? "Playing" : "Paused";
    }
  }

  if (totalIcons === 0) {
    wheelNodesEl.classList.add('icons-loaded');
    document.getElementById('centerStatus').classList.remove('loading');
    document.getElementById('centerStatus').textContent = isPlaying ? "Playing" : "Paused";
  } else {
    iconUrls.forEach(url => {
      const img = new Image();
      img.onload = onIconSettled;
      img.onerror = onIconSettled;
      img.src = url;
    });
  }

  // ---------------------------------------------------------------
  // EASTER EGG INTERACTION ENGINE
  // ---------------------------------------------------------------
  const easterNode = document.getElementById('mojaveNode');
  easterNode.dataset.station = "Mojave Radio";
  easterNode.addEventListener('click', (e) => {
    e.stopPropagation(); 
    selectStation("Mojave Radio");
  });

  let clickCount = 0;
  document.getElementById('centerTrigger').addEventListener('click', () => {
    if (clickCount >= 10) return; 
    
    clickCount++;
    if (clickCount === 10) {
      easterNode.classList.add('reveal');
      document.getElementById('centerStatus').style.color = 'var(--easter-glow)';
      document.getElementById('centerStatus').textContent = "Signal Found";
      setTimeout(() => {
        document.getElementById('centerStatus').style.color = 'var(--active-glow)';
        document.getElementById('centerStatus').textContent = isPlaying ? "Playing" : "Paused";
      }, 2000);
    }
  });

  // ---------------------------------------------------------------
  // CORE SELECTION MECHANICS
  // ---------------------------------------------------------------
  let isPlaying = false;
  let player;

  function selectStation(name) {
    document.querySelectorAll('.node').forEach(el => el.classList.remove('active'));
    const targetNode = document.querySelector(`.node[data-station="${name}"]`);
    if(targetNode) targetNode.classList.add('active');

    document.getElementById('centerStation').textContent = name;

    const videoId = stationTracks[name];
    if (player && player.loadVideoById && videoId) {
      player.loadVideoById(videoId);
    }
  }

  // ---------------------------------------------------------------
  // YOUTUBE EMBED LOADING
  // ---------------------------------------------------------------
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  function onYouTubeIframeAPIReady(){
    player = new YT.Player('ytPlayer', {
      height: '100%',
      width: '100%',
      videoId: stationTracks[initialStation],
      playerVars: { 
        rel: 0,
        referrerPolicy: 'strict-origin-when-cross-origin'
      },
      events: { 'onStateChange': onPlayerStateChange }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  function onPlayerStateChange(e){
    if (e.data === YT.PlayerState.PLAYING) setPlayingUI(true);
    else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) setPlayingUI(false);
  }

  function setPlayingUI(playing){
    isPlaying = playing;
    document.getElementById('playBtn').innerHTML = playing ? '&#10073;&#10073;' : '&#9658;';
    
    if (clickCount < 10 || document.getElementById('centerStatus').textContent !== "Signal Found") {
      document.getElementById('centerStatus').textContent = playing ? "Playing" : "Paused";
    }
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    if (!player) return;
    if (isPlaying) player.pauseVideo(); else player.playVideo();
  });
</script>

</body>
</html>
